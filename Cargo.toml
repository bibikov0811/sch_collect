[package]
name = "sch-collect"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
base64 = "0.23"
wasm-bindgen = "0.2"
worker = { version = "0.8", features = ["d1"] }

[features]
default = ["debugging"]
debugging = []