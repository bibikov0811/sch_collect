[package]
name = "sch-collect"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23"
bcrypt = "0.19"
jsonwebtoken = "11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
wasm-bindgen = "0.2"
worker = { version = "0.8", features = ["d1", "axum", "timezone"] }

# 1. Fix for newer dependencies (v0.4+)
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# 2. Fix for older nested dependencies (v0.2)
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
default = []
debugging = []

[lib]
crate-type = ["cdylib", "rlib"]