name = "sch-collect"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-15"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# 1. Bind KV store for dynamic API authentication parameters
[[kv_namespaces]]
binding = "SCHWAB_STORE"
id = "2204d89fb4bb4b96a401d7c748f81c12"

# 2. Bind your D1 engine for your clean, pre-processed analytical targets
[[d1_databases]]
binding = "SCHWAB_DB"
database_name = "sch-collect"
database_id = "47cf8eff-92f6-4d9d-afde-73ac3127bb8c"

[[r2_buckets]]
binding = "SCHWAB_BUCKET"
bucket_name = "sch-collect"

# 3. Schedule execution timers
[triggers]
crons = [
  "*/20 * * * *",  # Renews credentials inside your KV store shell
  "*/1 * * * *"    # Scrapes Schwab endpoints, pre-processes, and populates SQL rows
]

[secrets]
required = [
    "API_KEY",
    "WORKER_SECRET"
]

[build]
command = "cargo install -q worker-build && worker-build --release"

